# Main Hydra configuration file
# @package _global_

defaults:
  - env: ft06_gnn
  - training: default
  - gnn: l2d 
  - experiment: null
  - pretrain: default
  - hpo: default #not triggered by default
  - marl: parallel
  - evaluation: standard_with_model_saving
  - agv: default
  - finetune: none
  - curriculum: nr
  - _self_
seed: 42


# Hydra configuration
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%m-%d}_${now:%H-%M-%S}_M_agv
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%m-%d}_${now:%H-%M-%S}_M_agv
    subdir: ${hydra:job.num}
  job:
    chdir: false


# Logging and output directories
log_dir: ${hydra:runtime.output_dir}/logs
save_dir: ${hydra:runtime.output_dir}/checkpoints

# Device configuration (will be set automatically)
device: auto

env:
  critic: "SB3LikeCriticMatrix_ohneAGV"